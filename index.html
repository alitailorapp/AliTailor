<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Tailor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
        }
        .header {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            padding: 80px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .header h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 700;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .container h2 {
            color: #11998e;
            margin-bottom: 20px;
        }
        .container p {
            line-height: 1.8;
            color: #666;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to Ali Tailor</h1>
    </div>
    <div class="container">
        <h2>Digital Tailor Account</h2>
        <p>This application is designed specifically for tailors to easily digitize all their customers' measurements and daily accounts, modernizing their workflow.</p>
    </div>
</body>
</html>
